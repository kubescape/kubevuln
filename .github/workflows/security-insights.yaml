name: security-insights

# security-insights.yml is a hand-maintained Security Insights v2 manifest.
# Nothing consumes it in-tree, so the v1 SECURITY-INSIGHTS.yml it replaces
# previously rotted unnoticed for ~2 years (expired 2024-10-12, invalid `stage`
# key, emeritus maintainers). This workflow makes both failure modes loud:
# schema drift fails on the PR that introduces it, and a lapsed review fails on
# a monthly schedule, with a warning while there is still time to review.

on:
  pull_request:
    paths:
      - 'security-insights.yml'
      # The v1 file name. A copy brought back under it would sit next to the v2
      # file and give the repository two Security Insights files, so the
      # single-copy check below has to run when one appears.
      - 'SECURITY-INSIGHTS.yml'
      - '.github/workflows/security-insights.yaml'
  schedule:
    # Monthly, not weekly: the pull_request trigger above only fires when someone
    # edits the manifest, and the v1 file went untouched from 2023 until #388 --
    # so a schedule is the only thing that ever runs the freshness check. Against
    # the 60-day warning window below, monthly still fires twice before the
    # review lapses.
    - cron: '0 6 1 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  validate:
    name: validate manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to open or refresh the review tracking issue on scheduled runs.
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail if the v1 SECURITY-INSIGHTS.yml exists next to security-insights.yml
        # Security Insights v2 lives in security-insights.yml. A second file
        # under the v1 name is ambiguous for anything that reads the manifest,
        # and the v1 schema it was written against is no longer validated here.
        run: |
          if [ -e SECURITY-INSIGHTS.yml ]; then
            echo "::error file=SECURITY-INSIGHTS.yml::SECURITY-INSIGHTS.yml (Security Insights v1) must not exist next to security-insights.yml. Move any facts still worth keeping into security-insights.yml and delete it."
            exit 1
          fi
          echo "security-insights.yml is the only Security Insights file"

      - name: Install cue
        uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: v0.17.1

      # Validated inline rather than with revanite-io/security-insights-action:
      # that action reads header.schema-version from the manifest and expands it
      # inside a bash script, so a pull request could run commands on the runner
      # through it. Here the schema version is fixed by this workflow and the
      # manifest's value is only compared as data, never expanded or printed.
      # The schema is fetched by the commit behind the v2.2.0 tag, so it cannot
      # change underneath us. -d '#SecurityInsights' is required: without it cue
      # vet accepts any file on schema 2.1.0 or later.
      - name: Validate security-insights.yml against the v2.2.0 schema
        env:
          SCHEMA_VERSION: 2.2.0
          SCHEMA_URL: https://raw.githubusercontent.com/ossf/security-insights/701ac2a02ef17fc8b316f5df685428773c51372a/spec/schema.cue # v2.2.0
        run: |
          declared=$(yq -r '.header.schema-version' security-insights.yml)
          if [ "${declared}" != "${SCHEMA_VERSION}" ]; then
            echo "::error file=security-insights.yml::header.schema-version must be ${SCHEMA_VERSION}. To move to a newer schema, update SCHEMA_VERSION and SCHEMA_URL in this workflow in the same pull request."
            exit 1
          fi
          curl -sSfL --connect-timeout 10 --max-time 60 -o "${RUNNER_TEMP}/si-schema.cue" "${SCHEMA_URL}"
          cue vet -c -d '#SecurityInsights' "${RUNNER_TEMP}/si-schema.cue" security-insights.yml
          echo "security-insights.yml is valid against Security Insights ${SCHEMA_VERSION}"

      - name: Fail if the manifest was last reviewed more than 365 days ago
        id: freshness
        # Security Insights v2 has no expiration-date: header.last-reviewed is
        # the only freshness signal, so the review lapses 365 days after it.
        run: |
          reviewed=$(yq -r '.header.last-reviewed' security-insights.yml)
          now_epoch=$(date -u +%s)
          # A date in the future would push the due date out with it and keep
          # this check quiet for years, so reject it outright.
          if [ "$(date -u -d "${reviewed}" +%s)" -gt "${now_epoch}" ]; then
            echo "::error file=security-insights.yml::header.last-reviewed (${reviewed}) is in the future; set it to the date the manifest was actually reviewed."
            exit 1
          fi
          due=$(date -u -d "${reviewed} + 365 days" +%F)
          due_epoch=$(date -u -d "${due}" +%s)
          days=$(( (due_epoch - now_epoch) / 86400 ))
          echo "last-reviewed: ${reviewed} (review due ${due}, ${days} days remaining)"
          # Classify on epoch seconds, not the truncated day count: a review that
          # lapsed a few hours ago yields days=0, which would fall through to the
          # "due in 0 days" branch and report a stale file as merely due soon.
          if [ "${due_epoch}" -le "${now_epoch}" ]; then
            level=error
            message="security-insights.yml was last reviewed on ${reviewed}, more than 365 days ago (review was due ${due})."
          elif [ "${days}" -lt 60 ]; then
            level=warning
            message="security-insights.yml was last reviewed on ${reviewed}; the review is due by ${due} (in ${days} days)."
          else
            exit 0
          fi
          message="${message} Re-review it against https://github.com/kubescape/project-governance/blob/main/MAINTAINERS.md and refresh header.last-reviewed (and header.last-updated if anything changed)."
          echo "message=${message}" >> "$GITHUB_OUTPUT"
          echo "::${level} file=security-insights.yml::${message}"
          if [ "${level}" = error ]; then
            exit 1
          fi

      - name: Open or refresh the review tracking issue
        # Only on scheduled runs: on a pull_request the annotation is already in
        # front of someone who can act on it. On a schedule nothing else routes
        # this to a maintainer, so raise an issue they will actually see -- in
        # the warning window too, since a warning annotation alone goes unread.
        if: ${{ always() && github.event_name == 'schedule' && steps.freshness.outputs.message != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ steps.freshness.outputs.message }}
          TITLE: 'security-insights.yml needs review'
        run: |
          body="${MESSAGE}

          Raised automatically by \`${GITHUB_WORKFLOW}\`: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Match on title rather than a label, so the step does not depend on a
          # label existing in the repo.
          existing=$(gh issue list --state open --search "in:title \"${TITLE}\"" \
            --json number --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            echo "refreshing existing issue #${existing}"
            gh issue comment "${existing}" --body "${body}"
          else
            echo "opening a new tracking issue"
            gh issue create --title "${TITLE}" --body "${body}"
          fi

      - name: Report maintainer drift from project-governance
        # Advisory only: this parses a Markdown table in another repo, which is
        # too brittle to gate a merge on. It annotates the run so the monthly
        # schedule surfaces drift instead of waiting for the review to lapse.
        continue-on-error: true
        run: |
          curl -sSfL --connect-timeout 10 --max-time 60 -o /tmp/MAINTAINERS.md \
            https://raw.githubusercontent.com/kubescape/project-governance/main/MAINTAINERS.md
          # Core maintainers are the rows of the first table after the core
          # maintainers heading. Stopping at the end of that table, rather than at
          # the next heading, keeps triagers, committers and emeritus maintainers
          # out of the comparison whatever those sections are called.
          heading='^The following table lists the Kubescape project core maintainers'
          if ! grep -qE "${heading}" /tmp/MAINTAINERS.md; then
            echo "::warning file=security-insights.yml::could not locate the core maintainers heading in project-governance/MAINTAINERS.md; maintainer drift not checked"
            exit 0
          fi
          # `|| true` keeps a no-match from tripping pipefail before the emptiness
          # check below can distinguish "format changed" from "no drift".
          awk -v heading="${heading}" '
            $0 ~ heading { found = 1; next }
            found && /^\|/ { in_table = 1; print; next }
            in_table { exit }
          ' /tmp/MAINTAINERS.md \
            | grep -oE '\[@[A-Za-z0-9_-]+\]' | tr -d '[]@' | sort -fu > /tmp/governance.txt || true
          if [ ! -s /tmp/governance.txt ]; then
            echo "::warning file=security-insights.yml::parsed no maintainers from project-governance/MAINTAINERS.md (link format may have changed); maintainer drift not checked"
            exit 0
          fi
          for list in project.administrators repository.core-team; do
            yq -r ".${list}[].social" security-insights.yml \
              | sed 's|^https://github.com/||' | sort -fu > /tmp/manifest.txt
            if ! diff -iu /tmp/governance.txt /tmp/manifest.txt > /tmp/drift.txt; then
              echo "::warning file=security-insights.yml::${list} differs from project-governance/MAINTAINERS.md"
              cat /tmp/drift.txt
            else
              echo "${list} matches project-governance/MAINTAINERS.md"
            fi
          done
