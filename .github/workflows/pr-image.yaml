name: PR Image Build
on:
  pull_request:
    types: [synchronize, ready_for_review, opened, reopened]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.dockerignore'
      - 'build/**'
      - '.github/workflows/pr-image.yaml'

# The image is pushed to Quay with its own registry secrets, not GITHUB_TOKEN, so read
# access for the checkout is all this needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    env:
      QUAY_USERNAME: ${{ secrets.QUAYIO_REGISTRY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAYIO_REGISTRY_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Login to Quay.io
        if: ${{ env.QUAY_USERNAME != '' && env.QUAY_PASSWORD != '' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: quay.io/kubescape
          username: ${{ secrets.QUAYIO_REGISTRY_USERNAME }}
          password: ${{ secrets.QUAYIO_REGISTRY_PASSWORD }}
      - name: Build the Image and Push to Quay.io
        id: build-and-push-image
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          export IMAGE_TAG=test-${COMMIT_HASH}
          export IMAGE_REPO=quay.io/kubescape/kubevuln
          echo "image_repo=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          export IMAGE_NAME=quay.io/kubescape/kubevuln:${IMAGE_TAG}
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          make docker-build TAG=${IMAGE_TAG} IMAGE=${IMAGE_REPO}
          if [ -n "$QUAY_USERNAME" ] && [ -n "$QUAY_PASSWORD" ]; then
            make docker-push TAG=${IMAGE_TAG} IMAGE=${IMAGE_REPO}
          fi
    outputs:
      image_tag: ${{ steps.build-and-push-image.outputs.image_tag }}
      image_repo: ${{ steps.build-and-push-image.outputs.image_repo }}
