name: pull_request_created
permissions:
  pull-requests: write
  security-events: write
  contents: read
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - '*.yaml'
      - '.github/workflows/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-created:
    permissions:
      pull-requests: write
      security-events: write
    uses: kubescape/workflows/.github/workflows/incluster-comp-pr-created.yaml@547a98f361e0713832308e3f34165bb89fd9b08c
    with:
      CGO_ENABLED: 0
      GO_VERSION: "1.26"
    secrets: inherit
