name: pull_request_created
permissions: read-all
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - '*.yaml'
      - '.github/workflows/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-created:
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    uses: kubescape/workflows/.github/workflows/incluster-comp-pr-created.yaml@93865c7a61d5888c04ee8b64106ef23c232bd0ff # main (2026-09-16)
    with:
      CGO_ENABLED: 0
      GO_VERSION: "1.26"
    secrets: inherit
